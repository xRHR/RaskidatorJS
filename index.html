<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raskidator</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<h1>Raskidator</h1>

<section id="bill-section">
  <h2>Чек</h2>
  <button id="add-item-btn">+ Добавить позицию</button>
  <table id="bill-table" class="list-table">
    <thead>
      <tr>
        <th>Позиция</th>
        <th>Кол-во</th>
        <th>Цена</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="bill-list"></tbody>
  </table>
  <p>Итого: <span id="total-sum">0</span> ₽</p>
</section>

<section id="people-section">
  <h2>Люди</h2>
  <button id="add-person-btn">+ Добавить человека</button>
  <table id="people-table" class="list-table">
    <thead>
      <tr>
        <th>Имя</th>
        <th>Позиции</th>
      </tr>
    </thead>
    <tbody id="people-list"></tbody>
  </table>
</section>

<section id="remaining-section">
  <h2>Остатки</h2>
  <table id="remaining-table" class="list-table">
    <thead>
      <tr>
        <th>Позиция</th>
        <th>Кол-во</th>
      </tr>
    </thead>
    <tbody id="remaining-list"></tbody>
  </table>
</section>

<section>
  <button id="calc-debt-btn">Раскидать долг</button>
</section>

<section id="result-section">
  <h2>Долг</h2>
  <table id="result-table" class="list-table">
    <thead>
      <tr>
        <th>Человек</th>
        <th>Долг</th>
      </tr>
    </thead>
    <tbody id="result-list"></tbody>
  </table>
</section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
